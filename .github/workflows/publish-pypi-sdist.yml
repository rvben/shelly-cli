name: Publish PyPI source distribution

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag whose source distribution should be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build source distribution
        run: uvx maturin sdist
      - name: Validate source distribution
        run: uvx --from twine twine check target/wheels/*.tar.gz
      - name: Publish source distribution
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uvx --from twine twine upload --skip-existing --verbose target/wheels/*.tar.gz
