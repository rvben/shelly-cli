name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse (defaults to Cargo.toml)"
        required: false
        type: string
      dry_run:
        description: "Build and validate without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve and validate release metadata
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          version="${REQUESTED_VERSION#v}"
          version="${version:-$manifest_version}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$manifest_version" = "$version"
          tag="v${version}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          elif [[ "$DRY_RUN" != "true" ]]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  check:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: make fmt-check
      - run: make lint
      - run: make test

  build:
    needs: [metadata, check]
    # Guard: self-hosted runners only execute on trusted events (tag push,
    # workflow_dispatch). Fork PRs must never dispatch jobs to self-hosted.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            maturin_args: --compatibility manylinux_2_28 --zig
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            maturin_args: --compatibility manylinux_2_28 --zig
          - target: x86_64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            maturin_args: ""
          - target: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            maturin_args: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            maturin_args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install maturin and zig
        shell: bash
        run: |
          uv venv "${RUNNER_TEMP}/build-venv"
          VENV_BIN="${RUNNER_TEMP}/build-venv/bin"
          [ -d "$VENV_BIN" ] || VENV_BIN="${RUNNER_TEMP}/build-venv/Scripts"
          VIRTUAL_ENV="${RUNNER_TEMP}/build-venv" uv pip install maturin ziglang
          echo "$VENV_BIN" >> "$GITHUB_PATH"

      - name: Build wheel and binary
        run: maturin build --release --target ${{ matrix.target }} ${{ matrix.maturin_args }}
        shell: bash

      - name: Package binary (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../shelly-${{ github.ref_name }}-${{ matrix.target }}.tar.gz shelly
        shell: bash

      - name: Package binary (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../shelly-${{ github.ref_name }}-${{ matrix.target }}.zip shelly.exe
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: shelly-${{ github.ref_name }}-${{ matrix.target }}.*

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  sdist:
    needs: [metadata, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install maturin
        shell: bash
        run: |
          uv venv "${RUNNER_TEMP}/build-venv"
          VENV_BIN="${RUNNER_TEMP}/build-venv/bin"
          [ -d "$VENV_BIN" ] || VENV_BIN="${RUNNER_TEMP}/build-venv/Scripts"
          VIRTUAL_ENV="${RUNNER_TEMP}/build-venv" uv pip install maturin
          echo "$VENV_BIN" >> "$GITHUB_PATH"
      - run: maturin sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            shelly-*.tar.gz
            shelly-*.zip

  publish-crates:
    needs: [metadata, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - if: ${{ inputs.dry_run != true }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Validate crates.io package
        if: ${{ inputs.dry_run == true }}
        run: cargo publish --locked --dry-run

  publish-pypi:
    needs: [metadata, release, build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: artifacts/wheels
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: artifacts/sdist
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Publish to PyPI
        if: ${{ inputs.dry_run != true }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv tool run twine upload --skip-existing --verbose artifacts/wheels/**/*.whl artifacts/sdist/*.tar.gz
      - name: Validate PyPI artifacts
        if: ${{ inputs.dry_run == true }}
        run: uvx --from twine==6.2.0 twine check --strict artifacts/wheels/wheel-*/*.whl artifacts/sdist/*.tar.gz

  update-homebrew:
    needs: release
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: Check for tap deploy key
        id: check-token
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_DEPLOY_KEY not set, skipping Homebrew formula update"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets and compute SHA256 hashes
        if: steps.check-token.outputs.skip == 'false'
        run: |
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/rvben/shelly-cli/releases/download/${TAG}"
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            curl -fsSL -o "shelly-${TAG}-${target}.tar.gz" "${BASE_URL}/shelly-${TAG}-${target}.tar.gz"
          done
          {
            echo "SHA_MACOS_ARM64=$(sha256sum shelly-${TAG}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)"
            echo "SHA_MACOS_X86=$(sha256sum shelly-${TAG}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)"
            echo "SHA_LINUX_ARM64=$(sha256sum shelly-${TAG}-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)"
            echo "SHA_LINUX_X86=$(sha256sum shelly-${TAG}-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Update Homebrew formula
        if: steps.check-token.outputs.skip == 'false'
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # Authenticate to the tap with a write deploy key scoped to
          # rvben/homebrew-tap. The key does not expire, so cross-repo pushes
          # keep working without periodic token rotation.
          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone git@github.com:rvben/homebrew-tap.git homebrew-tap
          cd homebrew-tap

          cat > Formula/shelly-cli.rb << 'FORMULA'
          class ShellyCli < Formula
            desc "Fast CLI for discovering, monitoring, and controlling Shelly devices"
            homepage "https://github.com/rvben/shelly-cli"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/rvben/shelly-cli/releases/download/v#{version}/shelly-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_MACOS_ARM64_PLACEHOLDER"
              else
                url "https://github.com/rvben/shelly-cli/releases/download/v#{version}/shelly-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "SHA_MACOS_X86_PLACEHOLDER"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/rvben/shelly-cli/releases/download/v#{version}/shelly-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"
              else
                url "https://github.com/rvben/shelly-cli/releases/download/v#{version}/shelly-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_X86_PLACEHOLDER"
              end
            end

            def install
              bin.install "shelly"
              bin.install_symlink "shelly" => "shelly-cli"
            end

            test do
              assert_match "shelly #{version}", shell_output("#{bin}/shelly --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc and replace placeholders
          sed -i 's/^          //' Formula/shelly-cli.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" Formula/shelly-cli.rb
          sed -i "s/SHA_MACOS_ARM64_PLACEHOLDER/${SHA_MACOS_ARM64}/" Formula/shelly-cli.rb
          sed -i "s/SHA_MACOS_X86_PLACEHOLDER/${SHA_MACOS_X86}/" Formula/shelly-cli.rb
          sed -i "s/SHA_LINUX_ARM64_PLACEHOLDER/${SHA_LINUX_ARM64}/" Formula/shelly-cli.rb
          sed -i "s/SHA_LINUX_X86_PLACEHOLDER/${SHA_LINUX_X86}/" Formula/shelly-cli.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/shelly-cli.rb
          git commit -m "Update shelly-cli to ${VERSION}"
          git push

  attest-release:
    name: Attest release artifacts
    needs: release
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/**/*
